spring.application.name=MPF-Library-Spring-Boot

# --- \u041D\u0430\u043B\u0430\u0448\u0442\u0443\u0432\u0430\u043D\u043D\u044F \u043F\u043E\u0440\u0442\u0443 ---
# Render \u0434\u0438\u043D\u0430\u043C\u0456\u0447\u043D\u043E \u043F\u0440\u0438\u0437\u043D\u0430\u0447\u0430\u0454 \u043F\u043E\u0440\u0442 \u0447\u0435\u0440\u0435\u0437 \u0437\u043C\u0456\u043D\u043D\u0443 \u043E\u0442\u043E\u0447\u0435\u043D\u043D\u044F PORT
server.port=${PORT:8080}

app.custom.message=Welcome to our library! (Production)

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.h2.console.enabled=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.freemarker.template-loader-path=classpath:/mail-templates/
app.mail.admin=${APP_MAIL_ADMIN:vynychenkoos@gmail.com}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always